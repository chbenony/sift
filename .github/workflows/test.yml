name: Test
on:
    pull_request:
concurrency:
    group: test-${{ github.event.pull_request.number }}
    cancel-in-progress: true
permissions:
    contents: read
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                go-version: "1.26.5"
            - run: go test -race ./...
            