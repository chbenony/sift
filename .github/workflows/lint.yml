name: Lint
on:
    pull_request:
concurrency:
    group: lint-${{ github.event.pull_request.number }}
    cancel-in-progress: true
permissions:
    contents: read
jobs:
    golangci-lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                go-version: stable
            - uses: golangci/golangci-lint-action@v9
              with:
                version: v2.12
